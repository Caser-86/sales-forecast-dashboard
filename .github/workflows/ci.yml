name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      # Generated data and model files are intentionally ignored by Git.
      - name: Recreate demo artifacts
        run: |
          python scripts/init_data.py
          python scripts/train_models.py

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Run Ruff
        run: python -m ruff check backend scripts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          find frontend/js -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
