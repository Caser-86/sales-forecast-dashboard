name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      # Generated data and model files are intentionally ignored by Git.
      - name: Recreate demo artifacts
        run: |
          python scripts/init_data.py
          python scripts/train_models.py

      - name: Run backend tests
        run: python -m pytest backend/tests -q --cov=backend/app --cov=backend/common --cov-report=term-missing --cov-fail-under=85

      - name: Run Ruff
        run: python -m ruff check backend scripts

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Check patch whitespace
        run: git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          find frontend/js -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build deployment images
        run: docker compose build --pull=false

      - name: Start deployment stack
        run: docker compose up -d

      - name: Wait for deployment stack
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: frontend
        env:
          CI: true
        run: npm run test:e2e

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

      - name: Stop deployment stack
        if: always()
        run: docker compose down -v

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit direct dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.7.3
          pip-audit -r backend/requirements.txt \
            --vulnerability-service osv \
            --index-url https://pypi.org/simple \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --strict --progress-spinner off
