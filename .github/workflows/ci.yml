name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Generate data
        run: python scripts/init_data.py

      - name: Train models
        run: python scripts/train_models.py

      - name: Run Ruff
        run: python -m ruff check backend/app backend/common backend/ml backend/tests scripts

      - name: Run tests
        run: python -m pytest backend/tests -q
