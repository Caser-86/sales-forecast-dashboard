<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售数据预测与可视化大屏</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/dashboard.css?v=3">
    <script src="vendor/echarts.min.js"></script>
</head>
<body>
    <div class="dashboard">
        <!-- 标题栏 -->
        <header class="header">
            <div class="header-title">销售数据预测与可视化大屏</div>
            <div class="header-info">
                <span id="currentDate"></span>
                <span id="currentTime"></span>
                <span class="status-dot"></span>
                <span id="headerStatus" class="status-text">状态检查中</span>
            </div>
        </header>

        <!-- Dashboard 作用域与运行状态 -->
        <section class="dashboard-toolbar" aria-label="大屏筛选与状态">
            <div class="toolbar-group">
                <label for="scopeProductSelect">商品范围</label>
                <select id="scopeProductSelect" class="select">
                    <option value="">全部商品</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label for="scopeStoreSelect">门店范围</label>
                <select id="scopeStoreSelect" class="select">
                    <option value="">全部门店</option>
                </select>
            </div>
            <button id="refreshDashboard" class="refresh-button" type="button">刷新数据</button>
            <input id="planName" class="plan-name" type="text" maxlength="120" value="补货草案" aria-label="补货草案名称">
            <button id="savePlan" class="refresh-button plan-button" type="button" disabled>保存草案</button>
            <a id="exportPlan" class="refresh-button plan-link hidden" href="#" download>导出草案</a>
            <span id="planStatus" class="plan-status" aria-live="polite">需要新鲜库存快照后可保存</span>
            <span id="scopeLabel" class="scope-label">当前范围：全部商品 · 全部门店</span>
            <span id="systemStatus" class="system-status pending" aria-live="polite">状态检查中</span>
            <span id="modelSummary" class="model-summary">模型指标：--</span>
            <span id="versionSummary" class="version-summary">版本：--</span>
            <span id="lastUpdated" class="last-updated">数据更新时间：--</span>
        </section>

        <!-- KPI 卡片 -->
        <section class="kpi-row">
            <div class="kpi-card">
                <div class="kpi-label">总销量（30天）</div>
                <div class="kpi-value" id="kpiTotalSales">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">预测销量（30天）</div>
                <div class="kpi-value" id="kpiTotalPredicted">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">增长率</div>
                <div class="kpi-value" id="kpiGrowth">0%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">预测准确率</div>
                <div class="kpi-value" id="kpiAccuracy">0%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">预警商品数</div>
                <div class="kpi-value" id="kpiAlert">0</div>
            </div>
        </section>

        <!-- 销量趋势图 -->
        <section class="chart-row main-chart">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">销量趋势图（历史 + 预测）</span>
                    <div class="panel-controls">
                        <select id="productSelect" class="select"></select>
                        <select id="storeSelect" class="select"></select>
                    </div>
                </div>
                <div id="salesLine" class="chart" role="img" tabindex="0" aria-label="商品门店历史销量与未来预测趋势图"></div>
            </div>
        </section>

        <!-- 库存热力图 + 品类饼图 -->
        <section class="chart-row two-col">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">需求优先级热力图（ABC）</span>
                </div>
                <div id="inventoryHeatmap" class="chart" role="img" tabindex="0" aria-label="商品与门店需求优先级热力图"></div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">品类销量占比</span>
                </div>
                <div id="categoryPie" class="chart" role="img" tabindex="0" aria-label="品类销量占比图"></div>
            </div>
        </section>

        <!-- Top 10 商品 -->
        <section class="chart-row">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Top 10 商品销量排行 + 采购建议</span>
                </div>
                <div id="topProducts" class="chart" role="img" tabindex="0" aria-label="Top 商品销量与采购建议图"></div>
            </div>
        </section>
    </div>

    <div id="emptyState" class="empty-state hidden" role="status">
        当前筛选范围暂无可展示数据
    </div>

    <!-- 加载遮罩 -->
    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载大屏数据...</div>
    </div>

    <!-- 错误提示横幅 -->
    <div id="errorBanner" class="error-banner hidden" role="alert" aria-live="assertive"></div>

    <script src="js/api.js?v=2"></script>
    <script src="js/safe-text.js?v=1"></script>
    <script src="js/charts/kpi-cards.js?v=2"></script>
    <script src="js/charts/sales-line.js?v=2"></script>
    <script src="js/charts/inventory-heatmap.js?v=3"></script>
    <script src="js/charts/category-pie.js?v=2"></script>
    <script src="js/charts/top-products.js?v=2"></script>
    <script src="js/dashboard.js?v=2"></script>
</body>
</html>
