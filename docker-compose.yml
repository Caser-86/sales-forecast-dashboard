services:
  backend:
    build: ./backend
    container_name: sales-backend
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据与模型（不进镜像，便于升级时保留）
      - ./backend/data:/app/data
      - ./backend/ml/saved_models:/app/ml/saved_models
      - ./backend/logs:/app/logs
    environment:
      - ENV=${ENV:-development}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}
      - API_TOKEN=${API_TOKEN:-}
      - API_TOKEN_HEADER=${API_TOKEN_HEADER:-X-API-Token}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/dashboard.db}
      - FORECAST_DAYS=${FORECAST_DAYS:-30}
      - FORECAST_WORKERS=${FORECAST_WORKERS:-4}
      - INVENTORY_MAX_AGE_DAYS=${INVENTORY_MAX_AGE_DAYS:-7}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: sales-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
